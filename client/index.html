<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ga.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Opt out of browser auto-darkening (e.g. Chrome force-dark): light only -->
    <meta name="color-scheme" content="only light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>Germany Assist</title>
    <style>
      html { background: #ffffff; }
    </style>
    <script>
      // Light mode only: strip any legacy dark-mode class/state from
      // earlier sessions before first paint.
      document.documentElement.classList.remove("dark");
      try { localStorage.removeItem("theme"); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

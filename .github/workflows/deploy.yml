name: Staging build & deploy

on:
  push:
    branches:
      - main

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and smoke test the staging stack
        run: |
          set -e
          docker compose -f docker-compose.staging.yml up --build -d --wait app
          docker compose -f docker-compose.staging.yml up -d mailhog s3-init
          curl -fsS http://127.0.0.1:3000/health
          docker compose -f docker-compose.staging.yml down -v

  deploy-droplet:
    # Runs automatically once the repository variable SERVER_DOMAIN is configured
    needs: staging
    if: ${{ vars.SERVER_DOMAIN != '' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_DOMAIN }}
          username: deploy
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e

            cd /var/www/germany-assist

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Rebuilding and restarting the staging stack..."
            docker compose -f docker-compose.staging.yml up --build -d --wait app
            docker compose -f docker-compose.staging.yml up -d mailhog s3-init

            echo "Deployment completed successfully."
